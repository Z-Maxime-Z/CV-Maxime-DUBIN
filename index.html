<title>Site CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style id="app-style">
/* Concept : CV en colonnes éditoriales. Libellés de section à gauche, contenu à droite, dates en chasse fixe. */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#111B22; --muted:#56666F; --line:#DCE3E7;
  --accent:#0C6B62; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --warn:#B26A00; --warn-soft:#FFF1D6;
  --danger:#B3261E; --danger-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(17,27,34,.06),0 10px 30px rgba(17,27,34,.10);
  --cur-a:#2F6FED; --cur-b:#C2255C; --cur-c:#B5500A; --cur-d:#6741D9; --cur-e:#0B7A75; --cur-f:#2F7D1F; --cur-g:#8F5B00; --cur-h:#475569; --cur-i:#8E2F7A; --caret:#3B82F6;
  --font-display:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#141D23; --ink:#E7EDF0; --muted:#9AABB5; --line:#25323A;
    --accent:#52C7B8; --accent-ink:#06211E; --accent-soft:#12403B;
    --warn:#F2B04E; --warn-soft:#3A2B0E;
    --danger:#FF8F86; --danger-ink:#3A0B08;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141D23; --ink:#E7EDF0; --muted:#9AABB5; --line:#25323A;
  --accent:#52C7B8; --accent-ink:#06211E; --accent-soft:#12403B;
  --warn:#F2B04E; --warn-soft:#3A2B0E;
  --danger:#FF8F86; --danger-ink:#3A0B08;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 128px;
}
.wrap{max-width:62rem;margin:0 auto;display:flex;flex-direction:column;gap:2.5rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* Barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:40px}
.stamp{font:500 .75rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag{font:500 .75rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:.35rem .6rem;border-radius:6px}

/* Boutons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  min-height:40px;padding:.6rem 1rem;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 .9rem/1.2 var(--font-body);cursor:pointer;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:.35rem .7rem;font-size:.8rem}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.quiet-danger{background:transparent;border-color:transparent;color:var(--danger)}
.btn.quiet-danger:hover{border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Bandeaux */
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:.9rem 1rem;border-radius:10px;border:1px solid var(--line);
  background:var(--warn-soft);color:var(--ink);
}
.banner.tip{background:var(--accent-soft)}
.banner p{margin:0;flex:1 1 18rem;font-size:.92rem}
.banner-btns{display:flex;gap:.5rem;flex-wrap:wrap}

/* En-tête */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.25rem 1.75rem;align-items:start}
.avatar{
  width:5.5rem;height:5.5rem;border-radius:20px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font:700 2rem/1 var(--font-display);letter-spacing:.02em;
}
h1{margin:0;font:700 clamp(2rem,6vw,3.4rem)/1.05 var(--font-display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
h1.ph{color:var(--muted)}
.headline{margin:.5rem 0 0;font:600 clamp(1.05rem,2.4vw,1.35rem)/1.35 var(--font-display);color:var(--muted)}
.contact{list-style:none;margin:1rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;font-size:.92rem}
.contact li{min-width:0;overflow-wrap:anywhere}
.sel{user-select:all}
.copy{font:600 .72rem var(--font-mono);color:var(--accent);background:none;border:0;padding:.2rem .35rem;cursor:pointer;text-decoration:underline}
.hero-edit{margin-top:1rem}
@media (max-width:520px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .avatar{width:4rem;height:4rem;border-radius:16px;font-size:1.5rem}
}

/* Sections */
.sec{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:.75rem 2.5rem;padding-top:1.75rem;border-top:1px solid var(--line)}
.sec-label{display:flex;flex-direction:column;align-items:flex-start;gap:.7rem}
.sec-label h2{margin:0;font:500 .75rem/1.4 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-body{display:flex;flex-direction:column;gap:1.7rem;min-width:0}
@media (max-width:720px){.sec{grid-template-columns:minmax(0,1fr)}.sec-label{flex-direction:row;align-items:center;justify-content:space-between;width:100%}}
.about{margin:0;max-width:65ch;white-space:pre-line}
.empty{margin:0;padding:.9rem 1rem;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.92rem}
.all-empty{padding:2.5rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* Éléments */
.item{
  position:relative;display:grid;grid-template-columns:9rem minmax(0,1fr);gap:.25rem 1.5rem;
  padding:.75rem;margin:-.75rem;border-radius:10px;border:1px dashed transparent;
}
.item.plain{grid-template-columns:minmax(0,1fr)}
.edit .item{border-color:var(--line)}
.edit .item-main{padding-right:5.5rem}
.item-actions{position:absolute;top:.5rem;right:.5rem}
.dates{font:500 .8rem/1.7 var(--font-mono);color:var(--muted);padding-top:.15rem}
.lcol{font-weight:600}
.item-main{min-width:0}
.item h3{margin:0;font:600 1.08rem/1.35 var(--font-display);overflow-wrap:anywhere}
.sub{margin:.1rem 0 0;color:var(--muted);font-size:.95rem}
.bul{margin:.6rem 0 0;padding-left:1.1rem;max-width:65ch}
.bul li{margin:.2rem 0}
.desc{margin:.4rem 0 0;max-width:65ch;white-space:pre-line}
.muted{color:var(--muted)}
.lnk{color:var(--accent);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{
  display:inline-block;padding:.25rem .6rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:6px;font:400 .88rem/1.4 var(--font-body);
}
.chip-btn{cursor:pointer}
.chip-btn:hover{border-color:var(--accent)}
@media (max-width:720px){
  .item{grid-template-columns:minmax(0,1fr)}
}

/* Barre de modification */
.editbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(0,0,0,.08);
  padding:.75rem max(16px,env(safe-area-inset-right,0px)) calc(.75rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.editbar-in{max-width:62rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:.55rem;font-size:.9rem;color:var(--muted)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.status.dirty{color:var(--ink)}
.status.dirty .dot{background:var(--warn)}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}

/* Fenêtre de saisie */
.ov{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,14,18,.55);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.modal{
  width:100%;max-width:36rem;max-height:100%;display:flex;flex-direction:column;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font:600 1.15rem/1.3 var(--font-display)}
.modal-form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-b{padding:1.25rem;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-content:start}
.fld{grid-column:1 / -1;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.fld.half{grid-column:auto}
@media (max-width:520px){.modal-b{grid-template-columns:minmax(0,1fr)}.fld.half{grid-column:1 / -1}}
.fld label{font:600 .85rem/1.3 var(--font-body)}
.req{color:var(--danger);margin-left:.15rem}
.fld input[type="text"],.fld textarea,.fld select{
  width:100%;min-height:42px;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:400 1rem/1.4 var(--font-body);
}
.fld textarea{min-height:7.5rem;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.fld.invalid input[type="text"],.fld.invalid textarea,.fld.invalid select{border-color:var(--danger)}
.fld select:disabled{opacity:.5}
.mp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem}
.mp3{grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr) minmax(0,1fr)}
.contact .lnk{text-underline-offset:3px}
.place{position:relative;display:inline-block}
.place-btn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.place-menu{position:absolute;z-index:30;top:calc(100% + .4rem);left:0;min-width:13rem;display:flex;flex-direction:column;padding:.35rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.place-menu .lead{margin:0;padding:.35rem .6rem;font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.place-menu a{padding:.5rem .6rem;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.92rem}
.place-menu a:hover,.place-menu a:focus-visible{background:var(--accent-soft);color:var(--accent)}
.hint{margin:0;color:var(--muted);font-size:.82rem}
.err{margin:0;color:var(--danger);font-size:.85rem}
.fld.chk label{display:flex;align-items:center;gap:.6rem;font-weight:500;font-size:.95rem}
.fld.chk input{width:1.15rem;height:1.15rem;accent-color:var(--accent);margin:0}
.modal-f{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-top:1px solid var(--line)}
.del-zone{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.9rem}
.f-actions{display:flex;gap:.5rem;margin-left:auto}

/* Curseurs qui construisent la page */
.avatar.has-photo{width:6.5rem;height:6.5rem;overflow:hidden;background:var(--accent-soft)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
@media (max-width:520px){.avatar.has-photo{width:5rem;height:5rem}}
.sketch{position:absolute;overflow:hidden;background:#F3EFE6}
.sketch img{display:block;width:100%;height:100%;object-fit:cover;filter:url(#cv-sketch);mix-blend-mode:multiply}
.top-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
#cursors{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.cur{position:absolute;left:0;top:0;opacity:1;transition:opacity .35s ease;will-change:transform}
.cur.off{opacity:0}
.cur .arrow{position:absolute;left:-3px;top:-2px;transition:transform .12s ease,opacity .15s ease;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.cur.click .arrow{transform:scale(.8)}
.cur.typing .arrow,.cur.writing .arrow{opacity:0}
.cur .pen{position:absolute;left:-2px;top:-20px;opacity:0;transition:opacity .15s ease;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.cur.writing .pen{opacity:1}
.cur .tag{position:absolute;left:12px;top:16px;padding:.1rem .5rem;border-radius:6px;background:var(--c);color:#fff;font:600 .72rem/1.5 var(--font-body);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.selbox{position:absolute;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.selbox i{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--c)}
.selbox i:nth-child(1){left:-4.5px;top:-4.5px}
.selbox i:nth-child(2){right:-4.5px;top:-4.5px}
.selbox i:nth-child(3){left:-4.5px;bottom:-4.5px}
.selbox i:nth-child(4){right:-4.5px;bottom:-4.5px}
.caret{position:absolute;width:2px;border-radius:1px;background:var(--caret)}
.t-rest{visibility:hidden}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));z-index:60;
  max-width:calc(100% - 32px);padding:.7rem 1rem;border-radius:10px;background:var(--ink);color:var(--bg);
  font-size:.9rem;box-shadow:var(--shadow);text-align:center;
}
</style>

function birthText(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');
  if(!m)return '';
  const y=+m[1],mo=+m[2],d=+m[3],now=new Date();
  let age=now.getFullYear()-y;
  if(now.getMonth()+1<mo||(now.getMonth()+1===mo&&now.getDate()<d))age--;
  return 'Né le '+(d===1?'1er':d)+' '+ML[mo-1]+' '+y+(age>=0&&age<120?' · '+age+' ans':'');
}
function telHref(v){
  const t=String(v||'').replace(/[^\d+]/g,'').replace(/^0(\d{9})$/,'+33$1');
  return t.length>=6?'tel:'+t:'';
}
function mapLinks(p){
  const city=String(p.location||'').trim();
  if(!city)return [];
  const zip=/^\d{5}$/.test(String(p.zip||'').trim())?String(p.zip).trim():'';
  const q=encodeURIComponent((zip?zip+' ':'')+city+', France');
  const slug=city.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const out=[{n:'Google Maps',u:'https://www.google.com/maps/search/?api=1&query='+q}];
  if(zip&&slug)out.push({n:'Mappy',u:'https://fr.mappy.com/plan/'+zip+'-'+slug});
  out.push({n:'OpenStreetMap',u:'https://www.openstreetmap.org/search?query='+q});
  out.push({n:'Apple Plans',u:'https://maps.apple.com/?q='+q});
  out.push({n:'Waze',u:'https://waze.com/ul?q='+q});
  return out;
}
function placeHTML(p){
  const ls=mapLinks(p);
  if(!ls.length)return '';
  return '<span class="place"><button type="button" class="place-btn" data-action="place" aria-haspopup="true" aria-expanded="false" aria-label="'+esc(p.location)+' : ouvrir sur une carte">'+esc(p.location)+'</button>'+
    '<div class="place-menu" role="menu" hidden><p class="lead">Voir sur une carte</p>'+
    ls.map(l=>'<a role="menuitem" href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.n)+'</a>').join('')+'</div></span>';
}
function linkHTML(u){
  return isHttp(u)?'<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(shortUrl(u))+'</a>':esc(u);
}

/* ---------- État ---------- */
function normalize(s){
  const o=Object.assign({v:1,example:false,updatedAt:''},s||{});
  const base={};PROFILE_KEYS.forEach(k=>{base[k]='';});base.photo='';
  o.profile=Object.assign(base,o.profile&&typeof o.profile==='object'?o.profile:{});
  SECTIONS.forEach(sec=>{
    if(!Array.isArray(o[sec.key]))o[sec.key]=[];
    o[sec.key]=o[sec.key].filter(x=>x&&typeof x==='object').map(x=>x.id?x:Object.assign({id:uid()},x));
  });
  o.certifications=o.certifications.map(x=>{
    if(x.date&&!x.start&&!x.end){const y=Object.assign({},x,{end:x.date});delete y.date;return y;}
    return x;
  });
  return o;
}

function sortDated(arr){
  const endKey=a=>a.current?'9999-99':(dkey(a.end)||dkey(a.start));
  arr.sort((a,b)=>{
    const ea=endKey(a),eb=endKey(b);
    if(ea!==eb)return ea<eb?1:-1;
    const sa=dkey(a.start),sb=dkey(b.start);
    if(sa!==sb)return sa<sb?1:-1;
    return 0;
  });
}

/* Brouillon local (sécurité si la page se ferme avant l’enregistrement) */
const DKEY='sitecv-draft-v1';
function persistDraft(){
  try{
    if(!isDirty()){localStorage.removeItem(DKEY);return;}
    localStorage.setItem(DKEY,JSON.stringify({base:saved.updatedAt||'',state:state}));
  }catch(e){}
}
function readDraft(){
  try{
    const raw=localStorage.getItem(DKEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    return d&&d.state&&typeof d.state==='object'?d:null;
  }catch(e){return null;}
}

let toastEl=null,toastT=0;
function toast(msg){
  if(!toastEl){
    toastEl=document.createElement('div');
    toastEl.className='toast';
    toastEl.setAttribute('role','status');
    toastEl.setAttribute('aria-live','polite');
    document.body.appendChild(toastEl);
  }
  toastEl.textContent=msg;
  toastEl.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(()=>{toastEl.hidden=true;},3600);
}

/* ---------- Formulaire (fenêtre) ---------- */
function fieldHTML(f,val){
  const id='f-'+f.k;
  const req=f.required?'<span class="req" aria-hidden="true">*</span>':'';
  const hint=f.hint?'<p class="hint" id="'+id+'-h">'+esc(f.hint)+'</p>':'';
  const err='<p class="err" id="'+id+'-e" role="alert" hidden></p>';
  const cls='fld'+(f.half?' half':'')+(f.type==='check'?' chk':'');
  let ctl='';
  if(f.type==='check'){
    return '<div class="'+cls+'" data-k="'+f.k+'"><label for="'+id+'"><input id="'+id+'" type="checkbox"'+(val?' checked':'')+'> '+esc(f.label)+'</label></div>';
  }
  if(f.type==='dob'){
    const bm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(val||'');
    const by=bm?bm[1]:'',bmo=bm?bm[2]:'',bd=bm?bm[3]:'';
    let ds='<option value="">Jour</option>';
    for(let i=1;i<=31;i++)ds+='<option value="'+pad(i)+'"'+(pad(i)===bd?' selected':'')+'>'+i+'</option>';
    let ms='<option value="">Mois</option>';
    ML.forEach((n,i)=>{ms+='<option value="'+pad(i+1)+'"'+(pad(i+1)===bmo?' selected':'')+'>'+n+'</option>';});
    let ys='<option value="">Année</option>';
    for(let y=new Date().getFullYear();y>=1940;y--)ys+='<option value="'+y+'"'+(String(y)===by?' selected':'')+'>'+y+'</option>';
    ctl='<div class="mp mp3"><select id="'+id+'-d" aria-label="'+esc(f.label)+' : jour">'+ds+'</select><select id="'+id+'-m" aria-label="'+esc(f.label)+' : mois">'+ms+'</select><select id="'+id+'-y" aria-label="'+esc(f.label)+' : année">'+ys+'</select></div>';
    return '<div class="'+cls+'" data-k="'+f.k+'"><label for="'+id+'-d">'+esc(f.label)+'</label>'+ctl+hint+err+'</div>';
  }
  if(f.type==='month'){
    const m=DRE.exec(val||'');
    const yy=m?m[1]:'',mm=m&&m[2]?m[2]:'';
    const now=new Date().getFullYear();
    let ys='<option value="">Année</option>';
    const years=[];
    for(let y=now+1;y>=1970;y--)years.push(String(y));
    if(yy&&years.indexOf(yy)<0)years.push(yy);
    years.forEach(y=>{ys+='<option value="'+y+'"'+(y===yy?' selected':'')+'>'+y+'</option>';});
    let ms='<option value="">Mois (facultatif)</option>';
    ML.forEach((n,i)=>{ms+='<option value="'+pad(i+1)+'"'+(pad(i+1)===mm?' selected':'')+'>'+n+'</option>';});
    ctl='<div class="mp"><select id="'+id+'-m" aria-label="'+esc(f.label)+' : mois">'+ms+'</select><select id="'+id+'-y" aria-label="'+esc(f.label)+' : année">'+ys+'</select></div>';
    return '<div class="'+cls+'" data-k="'+f.k+'"><label for="'+id+'-y">'+esc(f.label)+req+'</label>'+ctl+hint+err+'</div>';
  }
  if(f.type==='area'){
    ctl='<textarea id="'+id+'" rows="5" aria-describedby="'+id+'-h '+id+'-e">'+esc(val)+'</textarea>';
  }else if(f.type==='select'){
    ctl='<select id="'+id+'">'+f.options.map(o=>'<option'+(o===(val||f.def)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }else{
    const extra=f.type==='url'?' inputmode="url" autocapitalize="off" spellcheck="false"':(f.type==='email'?' inputmode="email" autocapitalize="off" spellcheck="false"':'');
    ctl='<input id="'+id+'" type="text" autocomplete="off"'+extra+' value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'" aria-describedby="'+id+'-h '+id+'-e">';
  }
  return '<div class="'+cls+'" data-k="'+f.k+'"><label for="'+id+'">'+esc(f.label)+req+'</label>'+ctl+hint+err+'</div>';
}

function readField(f){
  const id='f-'+f.k;
  if(f.type==='check')return {val:$('#'+id).checked};
  if(f.type==='dob'){
    const d=$('#'+id+'-d').value,m=$('#'+id+'-m').value,y=$('#'+id+'-y').value;
    if(!d&&!m&&!y)return {val:''};
    if(!d||!m||!y)return {val:'',err:'Choisissez le jour, le mois et l’année.'};
    const dt=new Date(+y,+m-1,+d);
    if(dt.getFullYear()!==+y||dt.getMonth()!==+m-1||dt.getDate()!==+d)return {val:'',err:'Cette date n’existe pas.'};
    if(dt>new Date())return {val:'',err:'Cette date est dans le futur.'};
    return {val:y+'-'+m+'-'+d};
  }
  if(f.type==='month'){
    const y=$('#'+id+'-y').value,m=$('#'+id+'-m').value;
    if(!y)return m?{val:'',err:'Choisissez aussi l’année.'}:{val:''};
    return {val:m?y+'-'+m:y};
  }
  let v=$('#'+id).value.replace(/\r\n/g,'\n');
  v=f.type==='area'?v.trim():v.trim();
  if(f.type==='url'){
    const u=normUrl(v);
    if(u===null)return {val:v,err:'Adresse invalide. Exemple : monsite.fr'};
    return {val:u};
  }
  if(f.type==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return {val:v,err:'Adresse e-mail invalide.'};
  return {val:v};
}

function validate(def,vals,errs){
  if(def.dated&&vals.current)delete errs.end;
  def.fields.forEach(f=>{
    if(errs[f.k]||!f.required||f.type==='check')return;
    if(!String(vals[f.k]||'').trim())errs[f.k]=f.type==='month'?'Indiquez au moins l’année.':'Ce champ est obligatoire.';
  });
  if(def.dated){
    if(vals.current)vals.end='';
    else if(def.key==='experiences'&&!vals.end&&!errs.end)errs.end='Indiquez la date de fin, ou cochez « Je suis toujours en poste ».';
    if(vals.start&&vals.end&&!errs.end&&dkey(vals.end)<dkey(vals.start))errs.end='La fin ne peut pas précéder le début.';
  }
}

function showErrors(errs){
  if(!modal)return;
  modal.def.fields.forEach(f=>{
    const box=$('[data-k="'+f.k+'"]',modal.ov);
    if(!box)return;
    const p=$('.err',box);
    const msg=errs[f.k];
    box.classList.toggle('invalid',!!msg);
    if(p){p.hidden=!msg;p.textContent=msg||'';}
    box.querySelectorAll('input,select,textarea').forEach(el=>{
      if(msg)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid');
    });
  });
}

function syncCurrent(){
  if(!modal)return;
  const cur=$('#f-current',modal.ov),end=$('#f-end-m',modal.ov),endY=$('#f-end-y',modal.ov);
  if(!cur||!end||!endY)return;
  end.disabled=cur.checked;endY.disabled=cur.checked;
}

function openForm(secKey,id,trigger){
  const isProfile=secKey==='profile';
  const def=isProfile?PROFILE:SECTIONS.find(s=>s.key===secKey);
  if(!def)return;
  const item=isProfile?state.profile:(id?state[secKey].find(x=>x.id===id):null);
  if(!isProfile&&id&&!item)return;
  closeForm(true);
  const title=isProfile||id?def.editT:def.addT;
  const body=def.fields.map(f=>{
    let v=item?item[f.k]:'';
    if(v==null)v='';
    return fieldHTML(f,v);
  }).join('');
  const del=(!isProfile&&id)?'<div class="del-zone" id="del-zone"><button type="button" class="btn quiet-danger" data-m="ask-del">Supprimer</button></div>':'<div></div>';
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">'+
    '<div class="modal-h"><h2 id="m-title">'+esc(title)+'</h2><button type="button" class="btn sm ghost" data-m="close">Fermer</button></div>'+
    '<form class="modal-form" novalidate><div class="modal-b">'+body+'</div>'+
    '<div class="modal-f">'+del+'<div class="f-actions"><button type="button" class="btn" data-m="close">Annuler</button><button type="submit" class="btn primary">'+(isProfile||id?'Valider':'Ajouter')+'</button></div></div></form></div>';
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  const sels=[];
  if(trigger&&trigger.dataset){
    const d=trigger.dataset;
    if(d.action==='edit')sels.push('[data-action="edit"][data-section="'+d.section+'"][data-id="'+d.id+'"]');
    if(d.section)sels.push('[data-action="add"][data-section="'+d.section+'"]');
    if(d.action==='edit-profile')sels.push('[data-action="edit-profile"]');
  }
  modal={ov:ov,def:def,secKey:secKey,id:id||null,isProfile:isProfile};
  focusSels=sels.length?sels:null;
  ov.addEventListener('click',onModalClick);
  ov.addEventListener('keydown',onModalKey);
  $('form',ov).addEventListener('submit',e=>{e.preventDefault();submitForm();});
  const cur=$('#f-current',ov);
  if(cur)cur.addEventListener('change',syncCurrent);
  syncCurrent();
  const first=$('input[type="text"],textarea,select,input',$('.modal-b',ov));
  if(first)first.focus();
}

function closeForm(keepFocus){
  if(!modal)return;
  modal.ov.remove();
  modal=null;
  document.body.style.overflow='';
  if(!keepFocus)refocus();
}

function onModalClick(e){
  const b=e.target.closest('[data-m]');
  if(!b||!modal)return;
  const a=b.dataset.m;
  if(a==='close'){closeForm();return;}
  if(a==='ask-del'){
    const z=$('#del-zone',modal.ov);
    z.innerHTML='<span>Supprimer cet élément ?</span><button type="button" class="btn danger" data-m="del-yes">Oui, supprimer</button><button type="button" class="btn" data-m="del-no">Non</button>';
    const no=$('[data-m="del-no"]',z);
    if(no)no.focus();
    return;
  }
  if(a==='del-no'){
    const z=$('#del-zone',modal.ov);
    z.innerHTML='<button type="button" class="btn quiet-danger" data-m="ask-del">Supprimer</button>';
    const ask=$('[data-m="ask-del"]',z);
    if(ask)ask.focus();
    return;
  }
  if(a==='del-yes'){
    const key=modal.secKey,id=modal.id;
    state[key]=state[key].filter(x=>x.id!==id);
    focusSels=['[data-action="add"][data-section="'+key+'"]'];
    afterChange('Élément supprimé.');
  }
}

function onModalKey(e){
  if(e.key==='Escape'){e.preventDefault();closeForm();return;}
  if(e.key!=='Tab'||!modal)return;
  const list=Array.from(modal.ov.querySelectorAll('button,input,select,textarea,a[href]')).filter(el=>!el.disabled&&el.offsetParent!==null);
  if(!list.length)return;
  const first=list[0],last=list[list.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}

function submitForm(){
  if(!modal)return;
  const def=modal.def;
  const vals={},errs={};
  def.fields.forEach(f=>{
    const r=readField(f);
    vals[f.k]=r.val;
    if(r.err)errs[f.k]=r.err;
  });
  validate(def,vals,errs);
  showErrors(errs);
  const bad=def.fields.find(f=>errs[f.k]);
  if(bad){
    const box=$('[data-k="'+bad.k+'"]',modal.ov);
    const el=box&&box.querySelector('input:not(:disabled),select:not(:disabled),textarea');
    if(el)el.focus();
    return;
  }
  if(modal.isProfile){
    const p={};
    PROFILE_KEYS.forEach(k=>{p[k]=vals[k]||'';});
    state.profile=Object.assign({},state.profile,p);
    afterChange('Profil mis à jour.');
    return;
  }
  const id=modal.id;
  const item={id:id||uid()};
  def.fields.forEach(f=>{
    const v=vals[f.k];
    if(f.type==='check'){if(v)item[f.k]=true;}
    else if(String(v||'').trim())item[f.k]=v;
  });
  const arr=state[def.key];
  if(id){
    const i=arr.findIndex(x=>x.id===id);
    if(i>-1)arr[i]=item;else arr.push(item);
  }else arr.push(item);
  if(def.dated)sortDated(arr);
  focusSels=['[data-action="edit"][data-section="'+def.key+'"][data-id="'+item.id+'"]','[data-action="add"][data-section="'+def.key+'"]'];
  afterChange(id?'Modification prise en compte.':'Élément ajouté.');
}

function afterChange(msg){
  closeForm(true);
  persistDraft();
  render();
  toast(msg);
}

/* ---------- Enregistrement ---------- */
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
const SC='</scr'+'ipt>';
function buildDoc(s){
  const css=$('#app-style').textContent;
  const code=$('#app-code').textContent;
  const fonts=$('#app-fonts').getAttribute('href');
  const json=JSON.stringify(s).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return SKEL+
    '<title>Site CV</title>'+
    '<meta name="claude:viewport-fit-sides" content="cover">'+
    '<link id="app-fonts" rel="stylesheet" href="'+esc(fonts)+'">'+
    '<style id="app-style">'+css+'</style>'+
    '<div id="app" class="wrap"></div>'+
    '<script type="application/json" id="cv-data">'+json+SC+
    '<script id="app-code">'+code+SC+
    '</body></html>';
}

async function save(){
  if(saving||!isDirty()||!api)return;
  const next=clone(state);
  next.example=false;
  next.updatedAt=new Date().toISOString();
  let html;
  try{html=buildDoc(next);}catch(e){toast('La sauvegarde n’a pas pu être préparée.');return;}
  saving=true;
  persistDraft();
  render();
  try{
    await api.publish(html);
    clearDraft();
    saved=clone(next);
    savedJSON=JSON.stringify(saved);
    state=clone(saved);
    saving=false;
    editing=false;
    render();
    toast('CV enregistré.');
  }catch(err){
    saving=false;
    const c=err&&err.code;
    if(c==='conflict')toast('Une version plus récente existe : la page va se recharger. Votre brouillon est conservé.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){
      canEdit=false;editing=false;
      toast('Cette page est en lecture seule : l’enregistrement n’est pas possible ici.');
    }
    else if(c==='rate_limited')toast('Trop d’enregistrements rapprochés. Réessayez dans un instant.');
    else if(c==='too_large')toast('Le CV est trop volumineux pour être enregistré.');
    else toast('L’enregistrement a échoué. Vos modifications sont conservées : réessayez.');
    render();
  }
}

/* ---------- Actions ---------- */
async function copyText(text,btn){
  try{
    await navigator.clipboard.writeText(text);
    toast('Copié.');
  }catch(e){
    const li=btn.closest('li');
    const sel=li&&li.querySelector('.sel');
    if(sel){
      const r=document.createRange();r.selectNodeContents(sel);
      const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    }
    toast('Texte sélectionné : copiez-le avec Ctrl+C ou Cmd+C.');
  }
}

function handleAction(b){
  const a=b.dataset.action;
  if(a==='copy'){copyText(b.dataset.v||'',b);return;}
  if(a==='place'){
    const menu=b.parentNode.querySelector('.place-menu'),open=menu.hidden;
    closePlace();
    if(open){menu.hidden=false;b.setAttribute('aria-expanded','true');}
    return;
  }
  if(a==='replay'){if(!editing&&!modal){window.scrollTo({top:0,behavior:'instant'});B.start();}return;}
  if(!canEdit)return;
  switch(a){
    case 'enter-edit':editing=true;render();break;
    case 'add':openForm(b.dataset.section,null,b);break;
    case 'edit':openForm(b.dataset.section,b.dataset.id,b);break;
    case 'edit-profile':openForm('profile',null,b);break;
    case 'save':save();break;
    case 'finish':editing=false;confirmDiscard=false;render();break;
    case 'discard':
      if(!confirmDiscard){
        confirmDiscard=true;
        clearTimeout(discardTimer);
        discardTimer=setTimeout(()=>{confirmDiscard=false;render();},5000);
        render();
      }else{
        clearTimeout(discardTimer);
        confirmDiscard=false;
        state=clone(saved);
        clearDraft();
        editing=false;
        render();
        toast('Modifications annulées.');
      }
      break;
    case 'reset-empty':
      state=normalize({example:false,updatedAt:saved.updatedAt});
      editing=true;
      persistDraft();
      render();
      toast('Page vierge prête : ajoutez vos informations.');
      break;
    case 'restore-draft':
      if(draft){state=normalize(draft.state);draft=null;editing=true;render();toast('Brouillon repris.');}
      break;
    case 'ignore-draft':
      draft=null;clearDraft();render();
      break;
  }
}

function closePlace(){
  document.querySelectorAll('#app .place-menu').forEach(m=>{
    if(!m.hidden){
      m.hidden=true;
      const btn=m.parentNode.querySelector('.place-btn');
      if(btn)btn.setAttribute('aria-expanded','false');
    }
  });
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.place'))closePlace();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const open=document.querySelector('#app .place-menu:not([hidden])');
    if(open){const btn=open.parentNode.querySelector('.place-btn');closePlace();if(btn)btn.focus();}
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(b&&$('#app')&&$('#app').contains(b))handleAction(b);
});

/* ---------- Animation : des curseurs construisent la page ---------- */
const CUR=[
  {name:'Profil',c:'var(--cur-a)'},{name:'Parcours',c:'var(--cur-b)'},{name:'Compétences',c:'var(--cur-c)'},
  {name:'Passions',c:'var(--cur-d)'},{name:'Titres',c:'var(--cur-e)'},{name:'Dates',c:'var(--cur-f)'},
  {name:'Style',c:'var(--cur-g)'},{name:'Contenu',c:'var(--cur-h)'},{name:'Relecture',c:'var(--cur-i)'}
];
const B={id:0,active:false,units:[],groups:[],cursors:[],layer:null,io:null,left:0,dog:0,speed:1,vel:0,rr:0,onScroll:null,lastY:0,lastT:0};
const ABORT={aborted:true};
const reduced=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const place=c=>{c.el.style.transform='translate3d('+c.x+'px,'+c.y+'px,0)';};
const gone=el=>{const r=el.getBoundingClientRect();return r.bottom<0||r.top>window.innerHeight;};
function wait(id,ms){return new Promise((res,rej)=>setTimeout(()=>id===B.id?res():rej(ABORT),ms/B.speed));}
function tween(id,ms,fn,el){
  return new Promise((res,rej)=>{
    let last=performance.now(),acc=0;
    (function tick(now){
      if(id!==B.id){rej(ABORT);return;}
      acc+=Math.max(0,now-last)*B.speed;last=now;
      let p=ms<=0?1:Math.min(1,acc/ms);
      if(el&&p<1&&gone(el))p=1;
      try{fn(p);}catch(e){rej(e);return;}
      if(p<1)requestAnimationFrame(tick);else res();
    })(last);
  });
}
B.stop=function(){
  B.id++;B.active=false;
  clearTimeout(B.dog);
  if(B.io){B.io.disconnect();B.io=null;}
  if(B.onScroll){window.removeEventListener('scroll',B.onScroll);B.onScroll=null;}
  B.units.forEach(u=>{
    try{
      if(u.hold)u.hold.cancel();
      if(u.anim)u.anim.cancel();
      u.el.style.clipPath='';
      if(u.typed)u.el.innerHTML=u.orig;
    }catch(e){}
  });
  B.cursors.forEach(c=>clearTimeout(c.idle));
  if(B.layer){B.layer.remove();B.layer=null;}
  B.units=[];B.groups=[];B.cursors=[];B.left=0;B.speed=1;B.vel=0;
};
function makeCursor(d,i){
  const el=document.createElement('div');
  el.className='cur off';
  el.style.setProperty('--c',d.c);
  el.innerHTML='<svg class="arrow" width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M3 2v15l4.2-3.8 2.8 6.4 2.6-1.2-2.7-6.2H15z" fill="var(--c)" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg><svg class="pen" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 20l1.2-5L15 3.2a2 2 0 0 1 2.8 0l1 1a2 2 0 0 1 0 2.8L7 19z" fill="var(--c)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M2 20l5-1.2-3.8-3.8z" fill="#fff"/></svg><span class="tag"></span>';
  el.querySelector('.tag').textContent=d.name;
  B.layer.appendChild(el);
  const c={el:el,color:d.c,x:window.innerWidth*(.05+.1*i),y:-40,queue:[],busy:false,idle:0,sign:1};
  place(c);
  return c;
}
async function moveTo(cur,tx,ty,id){
  const x0=cur.x,y0=cur.y,dx=tx-x0,dy=ty-y0,dist=Math.hypot(dx,dy);
  if(dist<2)return;
  cur.sign=-cur.sign;
  const k=dist*.1*cur.sign,nx=-dy/dist,ny=dx/dist;
  await tween(id,clamp(160+dist*.5,240,820),p=>{
    const e=ease(p),w=Math.sin(Math.PI*p)*k;
    cur.x=x0+dx*e+nx*w;cur.y=y0+dy*e+ny*w;place(cur);
  });
}
function makeSel(cur){
  const sel=document.createElement('div');
  sel.className='selbox';
  sel.style.setProperty('--c',cur.color);
  sel.innerHTML='<i></i><i></i><i></i><i></i>';
  B.layer.appendChild(sel);
  return sel;
}
async function dragUnit(cur,u,id){
  const el=u.el;
  cur.el.classList.remove('typing','writing');
  let r=el.getBoundingClientRect();
  await moveTo(cur,r.left,r.top,id);
  r=el.getBoundingClientRect();
  const sel=makeSel(cur);
  if(u.hold){u.hold.cancel();u.hold=null;}
  el.style.clipPath='inset(0 100% 100% 0)';
  const dur=clamp(260+Math.hypot(r.width,r.height)*.45,380,900);
  try{
    await tween(id,dur,p=>{
      const e=ease(p),rr=el.getBoundingClientRect();
      cur.x=rr.left+rr.width*e;cur.y=rr.top+rr.height*e;place(cur);
      sel.style.left=rr.left+'px';sel.style.top=rr.top+'px';
      sel.style.width=(rr.width*e)+'px';sel.style.height=(rr.height*e)+'px';
      const q=((1-e)*100)+'%';
      el.style.clipPath='inset(0 '+q+' '+q+' 0)';
    },el);
    el.style.clipPath='';
    await wait(id,140);
  }finally{sel.remove();}
}
function caretRect(shown,rest,el){
  const rg=document.createRange();
  const rn=rest.firstChild;
  if(rn&&rn.length){
    rg.setStart(rn,0);rg.setEnd(rn,1);
    const r=rg.getBoundingClientRect();
    if(r.height>0)return {x:r.left,y:r.top,h:r.height};
  }
  const sn=shown.firstChild;
  if(sn&&sn.length){
    rg.setStart(sn,sn.length-1);rg.setEnd(sn,sn.length);
    const r=rg.getBoundingClientRect();
    if(r.height>0)return {x:r.right,y:r.top,h:r.height};
  }
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.top,h:parseFloat(getComputedStyle(el).lineHeight)||18};
}
async function typeUnit(cur,u,id){
  const el=u.el,text=el.textContent,tn=el.firstChild;
  if(!tn||tn.nodeType!==3||!text.trim()||el.children.length){await dragUnit(cur,u,id);return;}
  const rg=document.createRange();
  rg.setStart(tn,0);rg.setEnd(tn,1);
  const r=rg.getBoundingClientRect();
  cur.el.classList.remove('writing');
  await moveTo(cur,r.left,r.top+r.height/2,id);
  cur.el.classList.add('click');
  await wait(id,120);
  cur.el.classList.remove('click');
  u.typed=true;
  const shown=document.createElement('span'),rest=document.createElement('span');
  rest.className='t-rest';rest.textContent=text;
  el.textContent='';el.append(shown,rest);
  if(u.hold){u.hold.cancel();u.hold=null;}
  cur.el.classList.add('typing');
  const caret=document.createElement('div');
  caret.className='caret';
  B.layer.appendChild(caret);
  const len=text.length;
  try{
    await tween(id,clamp(len*26,380,1800),p=>{
      const n=Math.floor(p*len);
      shown.textContent=text.slice(0,n);rest.textContent=text.slice(n);
      const cr=caretRect(shown,rest,el);
      caret.style.left=(cr.x-1)+'px';caret.style.top=cr.y+'px';caret.style.height=cr.h+'px';
      cur.x=cr.x+2;cur.y=cr.y+cr.h;place(cur);
    },el);
  }finally{caret.remove();}
  cur.el.classList.remove('typing');
  el.innerHTML=u.orig;u.typed=false;
}
function lineBoxes(el){
  const rg=document.createRange();
  rg.selectNodeContents(el);
  const er=el.getBoundingClientRect();
  const lines=[];
  Array.from(rg.getClientRects()).filter(r=>r.width>0&&r.height>0).forEach(r=>{
    const top=r.top-er.top,bot=r.bottom-er.top,mid=(top+bot)/2;
    const l=lines.find(L=>Math.abs(L.mid-mid)<r.height*.5);
    if(l){
      l.left=Math.min(l.left,r.left-er.left);l.right=Math.max(l.right,r.right-er.left);
      l.top=Math.min(l.top,top);l.bot=Math.max(l.bot,bot);l.mid=(l.top+l.bot)/2;
    }else lines.push({left:r.left-er.left,right:r.right-er.left,top:top,bot:bot,mid:mid});
  });
  lines.sort((a,b)=>a.top-b.top);
  lines.forEach((L,i)=>{
    L.w=L.right-L.left;
    L.b0=i===0?0:(lines[i-1].bot+L.top)/2;
    L.b1=i===lines.length-1?er.height:(L.bot+lines[i+1].top)/2;
  });
  return lines;
}
function inkClip(lines,d){
  const first=lines[0],last=lines[lines.length-1];
  const pts=['0px '+first.b0+'px'];
  let acc=0;
  lines.forEach(L=>{
    const w=clamp(d-acc,0,L.w);
    acc+=L.w;
    const X=w>=L.w?L.right+8:L.left+w;
    pts.push(X+'px '+L.b0+'px',X+'px '+L.b1+'px');
  });
  pts.push('0px '+last.b1+'px');
  return 'polygon('+pts.join(',')+')';
}
async function inkUnit(cur,u,id){
  const el=u.el,lines=lineBoxes(el);
  if(!lines.length){await dragUnit(cur,u,id);return;}
  const r=el.getBoundingClientRect();
  cur.el.classList.remove('typing');
  await moveTo(cur,r.left+lines[0].left,r.top+lines[0].mid,id);
  cur.el.classList.add('writing');
  if(u.hold){u.hold.cancel();u.hold=null;}
  el.style.clipPath=inkClip(lines,0);
  const total=lines.reduce((a,L)=>a+L.w,0);
  try{
    await tween(id,clamp(total*2.2,520,1500),p=>{
      const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,d=e*total;
      el.style.clipPath=inkClip(lines,d);
      let acc=0,k=lines.length-1;
      for(let i=0;i<lines.length;i++){if(d<=acc+lines[i].w){k=i;break;}acc+=lines[i].w;}
      const L=lines[k],rr=el.getBoundingClientRect();
      cur.x=rr.left+L.left+clamp(d-acc,0,L.w);
      cur.y=rr.top+L.bot-(L.bot-L.top)*.15+Math.sin(p*46)*1.6;
      place(cur);
    },el);
  }finally{cur.el.classList.remove('writing');}
  el.style.clipPath='';
  await wait(id,120);
}
async function developUnit(cur,u,id){
  const el=u.el;
  cur.el.classList.remove('typing','writing');
  const r=el.getBoundingClientRect();
  await moveTo(cur,r.left,r.top,id);
  const sel=makeSel(cur);
  cur.el.classList.add('click');
  if(u.hold){u.hold.cancel();u.hold=null;}
  u.anim=el.animate([{opacity:0,filter:'blur(14px) saturate(0)',transform:'scale(1.08)'},{opacity:1,filter:'blur(0) saturate(1)',transform:'none'}],{duration:800,easing:'cubic-bezier(.2,.7,.2,1)'});
  u.anim.playbackRate=B.speed;
  try{
    await tween(id,900,p=>{
      const rr=el.getBoundingClientRect();
      sel.style.left=rr.left+'px';sel.style.top=rr.top+'px';sel.style.width=rr.width+'px';sel.style.height=rr.height+'px';
      cur.x=rr.left+rr.width*(1-p);cur.y=rr.top+rr.height*(1-p);place(cur);
      if(p>.3)cur.el.classList.remove('click');
    },el);
  }finally{cur.el.classList.remove('click');sel.remove();}
}
/* Photo : un dessin au crayon se trace ligne par ligne, puis la photo apparaît en couleur */
async function drawUnit(cur,u,id){
  const el=u.el,img=el.querySelector('img');
  if(!img){await developUnit(cur,u,id);return;}
  cur.el.classList.remove('typing');
  let r=el.getBoundingClientRect();
  await moveTo(cur,r.left,r.top,id);
  const ov=document.createElement('div');
  ov.className='sketch';
  ov.style.borderRadius=getComputedStyle(el).borderRadius;
  ov.appendChild(img.cloneNode());
  B.layer.appendChild(ov);
  cur.el.classList.add('writing');
  const rows=14;
  r=el.getBoundingClientRect();
  const w=r.width,h=r.height,lines=[];
  for(let i=0;i<rows;i++)lines.push({left:0,right:w,w:w,b0:i*h/rows,b1:(i+1)*h/rows});
  try{
    await tween(id,clamp(rows*w*1.3,1300,2200),p=>{
      const rr=el.getBoundingClientRect(),d=p*rows*w;
      ov.style.left=rr.left+'px';ov.style.top=rr.top+'px';ov.style.width=rr.width+'px';ov.style.height=rr.height+'px';
      ov.style.clipPath=inkClip(lines,d);
      const k=Math.min(rows-1,Math.floor(d/w));
      cur.x=rr.left+(d-k*w);
      cur.y=rr.top+(k+.5)*rr.height/rows+Math.sin(p*160)*3;
      place(cur);
    },el);
    cur.el.classList.remove('writing');
    if(u.hold){u.hold.cancel();u.hold=null;}
    u.anim=el.animate([{opacity:0},{opacity:1}],{duration:700,easing:'ease-out'});
    u.anim.playbackRate=B.speed;
    const fade=ov.animate([{opacity:1},{opacity:0}],{duration:700,easing:'ease-in',fill:'forwards'});
    fade.playbackRate=B.speed;
    await wait(id,720);
  }finally{cur.el.classList.remove('writing');ov.remove();}
}
async function softUnit(u,id){
  const el=u.el,m=u.mode;
  if(u.hold){u.hold.cancel();u.hold=null;}
  const from=m==='slide'?'translateX(-14px)':m==='pop'?'scale(.82)':'translateY(10px)';
  u.anim=el.animate([{opacity:0,transform:from},{opacity:1,transform:'none'}],{duration:m==='pop'?240:m==='slide'?300:380,easing:'cubic-bezier(.2,.7,.2,1)'});
  u.anim.playbackRate=B.speed;
  await wait(id,m==='pop'?70:m==='slide'?110:150);
}
function settle(u,id){
  if(id!==B.id)return;
  if(u.hold){u.hold.cancel();u.hold=null;}
  u.el.style.clipPath='';
  if(u.typed){u.el.innerHTML=u.orig;u.typed=false;}
  if(!u.done){
    u.done=true;B.left--;
    if(B.left<=0)finish(id);
  }
}
async function perform(cur,u,id){
  if(gone(u.el)){settle(u,id);return;}
  const soft=u.mode==='rise'||u.mode==='slide'||u.mode==='pop';
  if(!soft){clearTimeout(cur.idle);cur.el.classList.remove('off');}
  if(soft)await softUnit(u,id);
  else if(u.mode==='type')await typeUnit(cur,u,id);
  else if(u.mode==='ink')await inkUnit(cur,u,id);
  else if(u.mode==='develop')await developUnit(cur,u,id);
  else if(u.mode==='draw')await drawUnit(cur,u,id);
  else await dragUnit(cur,u,id);
  settle(u,id);
}
function pump(cur,id){
  if(cur.busy)return;
  cur.busy=true;
  (async()=>{
    try{
      while(cur.queue.length&&id===B.id){await perform(cur,cur.queue.shift(),id);}
      cur.idle=setTimeout(()=>cur.el.classList.add('off'),1500);
    }catch(e){
      if(e!==ABORT){try{console.error(e);}catch(x){}B.stop();}
    }finally{cur.busy=false;}
  })();
}
function finish(id){
  B.cursors.forEach(c=>c.el.classList.add('off'));
  setTimeout(()=>{if(id===B.id)B.stop();},700);
}
function trigger(g,id){
  if(g.fired||id!==B.id)return;
  g.fired=true;
  if(B.io)B.io.unobserve(g.host);
  const n=B.cursors.length,start=B.rr++%n;
  let best=null,bp=1e9;
  for(let k=0;k<n;k++){
    const c=B.cursors[(start+k)%n],pend=c.queue.length+(c.busy?1:0);
    if(pend<bp){bp=pend;best=c;}
  }
  g.units.forEach(u=>best.queue.push(u));
  pump(best,id);
}
B.start=function(){
  B.stop();
  const app=$('#app');
  if(!app||!('IntersectionObserver' in window)||!Element.prototype.animate)return;
  const id=B.id;
  const mk=(el,mode)=>{
    if(!el)return null;
    if(mode!=='develop'&&mode!=='draw'&&mode!=='drag'&&!el.textContent.trim())return null;
    return {el:el,mode:mode,orig:el.innerHTML,hold:null,anim:null,done:false,typed:false};
  };
  const SOFT='img,.dates,.lcol,h3,.sub,.bul li,.desc,.chip,.item-main.muted,.item-main > .lnk';
  const itemUnits=(host,us)=>{
    host.querySelectorAll(SOFT).forEach(el=>{
      let mode='rise';
      if(el.matches('img'))mode='develop';
      else if(el.matches('h3'))mode='ink';
      else if(el.matches('.desc'))mode='type';
      else if(el.matches('.bul li'))mode='slide';
      else if(el.matches('.chip'))mode='pop';
      us.push(mk(el,mode));
    });
  };
  const groups=[];
  const add=(host,us)=>{
    const list=us.filter(Boolean);
    if(host&&list.length)groups.push({host:host,units:list,fired:false});
  };
  const hero=$('.hero',app);
  if(hero){
    const av=$('.avatar',hero);
    if(av)add(av,[mk(av,av.querySelector('img')?'draw':'develop')]);
    const txt=hero.lastElementChild;
    const us=[mk($('h1',hero),'ink'),mk($('.headline',hero),'type')];
    hero.querySelectorAll('.contact li').forEach(el=>us.push(mk(el,'rise')));
    add(txt,us);
  }
  app.querySelectorAll('.sec').forEach(sec=>{
    const h2=$('.sec-label h2',sec);
    const key=h2&&h2.id?h2.id.slice(2):'';
    add(h2,[mk(h2,'type')]);
    const body=$('.sec-body',sec);
    if(body)Array.prototype.forEach.call(body.children,ch=>{
      const us=[];
      if(ch.classList.contains('about'))us.push(mk(ch,'type'));
      else if(ch.classList.contains('empty'))us.push(mk(ch,'rise'));
      else if(ch.classList.contains('item')&&(key==='languages'||key==='links'))us.push(mk(ch,'drag'));
      else itemUnits(ch,us);
      add(ch,us);
    });
  });
  if(!groups.length)return;
  B.active=true;
  const layer=document.createElement('div');
  layer.id='cursors';layer.setAttribute('aria-hidden','true');
  layer.innerHTML='<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="cv-sketch" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feGaussianBlur stdDeviation=".7"/><feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" divisor="1" edgeMode="duplicate" preserveAlpha="true"/><feComponentTransfer><feFuncR type="linear" slope="-7" intercept="1"/><feFuncG type="linear" slope="-7" intercept="1"/><feFuncB type="linear" slope="-7" intercept="1"/></feComponentTransfer></filter></svg>';
  document.body.appendChild(layer);
  B.layer=layer;
  B.cursors=CUR.map(makeCursor);
  B.groups=groups;
  groups.forEach(g=>g.units.forEach(u=>{
    u.hold=u.el.animate([{opacity:0},{opacity:0}],{duration:1000,fill:'both'});
    u.hold.pause();
    B.units.push(u);
  }));
  B.left=B.units.length;
  B.speed=1;B.vel=0;B.rr=0;
  B.lastY=window.scrollY;B.lastT=performance.now();
  const map=new Map();
  groups.forEach(g=>map.set(g.host,g));
  B.io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      const g=map.get(e.target);
      if(!g||g.fired||id!==B.id)return;
      const tall=e.boundingClientRect.height>window.innerHeight*.6;
      if(e.isIntersecting&&(e.intersectionRatio>=.5||(tall&&e.intersectionRatio>0)))trigger(g,id);
    });
  },{threshold:[0,.25,.5,.75,1],rootMargin:'0px 0px -4% 0px'});
  groups.forEach(g=>B.io.observe(g.host));
  let queued=false;
  B.onScroll=()=>{
    const now=performance.now(),y=window.scrollY,dt=Math.max(8,now-B.lastT);
    B.vel=B.vel*.6+(Math.abs(y-B.lastY)/dt*1000)*.4;
    B.lastY=y;B.lastT=now;
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{
      queued=false;
      if(id!==B.id)return;
      B.groups.forEach(g=>{if(!g.fired&&g.host.getBoundingClientRect().bottom<0)trigger(g,id);});
    });
  };
  window.addEventListener('scroll',B.onScroll,{passive:true});
  (function loop(){
    if(id!==B.id)return;
    const pend=B.cursors.reduce((a,c)=>a+c.queue.length,0);
    const target=1+clamp(B.vel/500,0,5)+Math.min(3,Math.max(0,pend-14)*.12);
    B.speed+=(target-B.speed)*.18;
    B.vel*=.95;
    requestAnimationFrame(loop);
  })();
  B.dog=setTimeout(()=>{if(id===B.id)B.stop();},60000);
};
function startBuild(){
  if(editing||modal||reduced())return;
  B.start();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&B.active)B.stop();});

/* ---------- Capacités de la page ---------- */
async function initCaps(){
  if(!(window.claude&&typeof window.claude.use==='function')){startBuild();return;}
  try{api=await window.claude.use('artifact');}catch(e){api=null;}
  if(!api){startBuild();return;}
  let u=null;
  try{u=await window.claude.use('user');}catch(e){u=null;}
  let ce=false;
  try{ce=u?await u.canEdit():false;}catch(e){ce=false;}
  canEdit=ce===true;
  if(canEdit){
    const d=readDraft();
    if(d){
      let same=false;
      try{same=JSON.stringify(normalize(d.state))===savedJSON;}catch(e){same=true;}
      if(same)clearDraft();else draft=d;
    }
  }
  render();
  startBuild();
}

render();
initCaps();
})();
